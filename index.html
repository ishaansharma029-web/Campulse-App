function bunksLeft(a, t) {
  let bunk = 0;
  while ((a / (t + bunk + 1)) * 100 >= REQUIRED) bunk++;
  return bunk;
}
function needToAttend(a, t) {
  if ((a / t) * 100 >= REQUIRED) return 0;
  let extra = 0;
  while (((a + extra) / (t + extra)) * 100 < REQUIRED) extra++;
  return extra;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast._id);
  toast._id = setTimeout(() => t.classList.add('hidden'), 2200);
}

function go(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  window.scrollTo(0, 0);
  if (name === 'pyqs') renderPyqs();
  if (name === 'timetable') renderTT();
  if (name === 'attendance') renderAtt();
  if (name === 'events') renderEvents();
  if (name === 'canteen') renderCanteen();
  if (name === 'hostel') renderHostel();
  if (name === 'hackmatch') renderHM();
}

function backBtn(title, sub) {

    <div><h2 class="text-2xl md:text-3xl font-bold">${title}</h2><p class="text-sm text-gray-400 mt-1">${sub}</p></div>
  </div>`;
}

function closeModal() {
  const m = document.getElementById('modal');
  m.classList.add('hidden');
  m.classList.remove('flex');
  m.innerHTML = '';
}
function openModal(html) {
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="w-full max-w-lg max-h-[85vh] overflow-y-auto bg-dark-800 border border-dark-700 rounded-2xl p-6 relative">
    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    ${html}
  </div>`;
  m.classList.remove('hidden');
  m.classList.add('flex');
}

          <p class="font-bold ${color} text-lg">${s.pct}%</p>
          <p class="text-xs text-gray-400">${s.attended}/${s.total} classes</p>
        </div>
        <button onclick="closeModal(); go('attendance')" class="text-sm px-3 py-2 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-500/20">Open tracker</button>
      </div>
    </div>
  `);
}

function renderTT() {
  const today = 'Mon';
  let grid = `<div class="overflow-x-auto rounded-2xl border border-dark-700">
    <table class="min-w-[720px] w-full text-sm">
      <thead class="bg-dark-800"><tr>
        <th class="p-3 text-left text-gray-400 font-medium w-32">Time</th>
        ${days.map(d => `<th class="p-3 text-left font-semibold ${d===today?'text-indigo-300':'text-white'}">${d}</th>`).join('')}
      </tr></thead><tbody>`;
  slots.forEach((time, i) => {
    grid += `<tr class="border-t border-dark-700">`;
    grid += `<td class="p-3 text-gray-400 align-top">${time}</td>`;
    days.forEach(d => {
      const cell = timetable[d][i];
      if (!cell) {
        grid += `<td class="p-2 align-top"><div class="slot rounded-xl bg-dark-900/40 border border-dashed border-dark-700 text-gray-600 text-xs flex items-center justify-center">Free</div></td>`;
      } else {
        const s = subjects[cell.id];
        grid += `<td class="p-2 align-top">
          <button onclick="openClass('${d}', ${i})" class="slot w-full text-left rounded-xl bg-indigo-500/10 border border-indigo-500/20 hover:border-indigo-400 p-3 transition-colors">
            <p class="font-semibold text-white leading-tight">${s.name}</p>
            <p class="text-[11px] text-indigo-300 mt-1">${s.prof}</p>
            <p class="text-[11px] text-gray-400 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>${s.room}</p>
            <span class="inline-block mt-2 text-[10px] px-1.5 py-0.5 rounded bg-dark-900/60 text-gray-300">${cell.type}</span>
          </button>
        </td>`;
      }
    });
    grid += `</tr>`;
  });
  grid += `</tbody></table></div>
    <p class="text-xs text-gray-500 mt-3">Tap a class card to open professor, room, and attendance.</p>`;
  document.getElementById('ttApp').innerHTML = backBtn('Timetable', 'ECE 3rd Year • Odd semester 2025–26') + grid;
}

function renderAtt() {
  const list = Object.values(subjects);
  const overallA = list.reduce((s, x) => s + x.attended, 0);
  const overallT = list.reduce((s, x) => s + x.total, 0);
  const overall = Math.round((overallA / overallT) * 100);
  const cards = list.map(s => {
    const pct = Math.round((s.attended / s.total) * 100);
    const ok = pct >= REQUIRED;
    const bunk = bunksLeft(s.attended, s.total);
    const need = needToAttend(s.attended, s.total);
    return `<button onclick="openClassFromSubject('${s.code}')" class="w-full text-left bg-dark-800/60 border border-dark-700 rounded-2xl p-5 hover:border-emerald-500/40">
      <div class="flex justify-between gap-3">
        <div>
          <h3 class="font-bold">${s.name}</h3>
          <p class="text-xs text-gray-400 mt-1">${s.code} • ${s.prof} • ${s.room}</p>
        </div>
        <span class="font-bold ${ok?'text-emerald-400':'text-rose-400'}">${pct}%</span>
      </div>
      <div class="w-full bg-dark-700 rounded-full h-1.5 mt-3"><div class="${ok?'bg-emerald-500':'bg-rose-500'} h-1.5 rounded-full" style="width:${pct}%"></div></div>
      <p class="text-xs text-gray-400 mt-3">${s.attended}/${s.total} attended • ${ok ? `You can bunk <b class='text-white'>${bunk}</b> more` : `Attend <b class='text-rose-300'>${need}</b> more to hit 75%`}</p>
    </button>`;
  }).join('');
  document.getElementById('attApp').innerHTML = backBtn('Attendance Sync', `ERP snapshot • overall ${overall}% (need ${REQUIRED}%)`) +
    `<div class="bg-dark-800/60 border border-dark-700 rounded-2xl p-6 mb-6">
      <div class="flex justify-between items-end"><div><p class="text-sm text-gray-400">Overall</p><p class="text-4xl font-bold text-emerald-400">${overall}%</p></div>
      <p class="text-sm text-gray-400">${overallA} / ${overallT} lectures</p></div>
      <div class="w-full bg-dark-700 rounded-full h-2 mt-4"><div class="bg-emerald-500 h-2 rounded-full" style="width:${overall}%"></div></div>
    </div>
    <div class="grid gap-4">${cards}</div>`;
}

function openClassFromSubject(code) {
  for (const d of days) {
    const i = timetable[d].findIndex(c => c && subjects[c.id].code === code);
    if (i >= 0) { openClass(d, i); return; }
  }
}

let pyqBranch = 'ECE';
let pyqKind = 'All';
function renderPyqs() {
  const branches = ['ECE', 'CSE', 'ME', 'Civil', 'EE'];
  const kinds = ['All', 'PYQ', 'Notes'];
  const filtered = resources.filter(r => r.branch === pyqBranch && (pyqKind === 'All' || r.kind === pyqKind));
  const chips = branches.map(b => `<button onclick="pyqBranch='${b}';renderPyqs()" class="px-3 py-1.5 rounded-full text-sm border ${pyqBranch===b?'bg-brand-600 border-brand-500':'bg-dark-800 border-dark-700 text-gray-300'}">${b}</button>`).join('');
  const kchips = kinds.map(k => `<button onclick="pyqKind='${k}';renderPyqs()" class="px-3 py-1.5 rounded-full text-xs border ${pyqKind===k?'bg-dark-700 border-brand-500 text-white':'border-dark-700 text-gray-400'}">${k}</button>`).join('');
  const cards = filtered.map((r, idx) => {
    const i = resources.indexOf(r);
    return `<button onclick="openResource(${i})" class="text-left bg-dark-800/60 border border-dark-700 rounded-2xl p-5 hover:border-brand-500/40">
      <div class="flex justify-between"><span class="text-[10px] uppercase tracking-wider ${r.kind==='PYQ'?'text-brand-400':'text-amber-300'}">${r.kind} • ${r.year}</span><span class="text-xs text-gray-500">${r.pages} pages</span></div>
      <h3 class="font-bold mt-2">${r.title}</h3>
      <p class="text-sm text-gray-400 mt-1">${r.branch} • ${r.sub}</p>
      <p class="text-xs text-brand-400 mt-3">Open & download</p>
    </button>`;
  }).join('');
  document.getElementById('pyqsApp').innerHTML = backBtn('PYQs & Notes', 'Filter by branch, then open any paper or note') +
    `<div class="flex flex-wrap gap-2 mb-3">${chips}</div>
     <div class="flex flex-wrap gap-2 mb-6">${kchips}</div>
     <div class="grid sm:grid-cols-2 gap-4">${cards || '<p class="text-gray-400">Nothing here yet.</p>'}</div>`;
}

function openResource(i) {
  const r = resources[i];
  openModal(`
    <p class="text-xs uppercase tracking-wider text-brand-400">${r.branch} • ${r.kind} • ${r.year}</p>
    <h3 class="text-xl font-bold mt-1 pr-8">${r.title}</h3>
    <p class="text-sm text-gray-400 mb-4">${r.sub} • ${r.pages} pages</p>
    <pre class="whitespace-pre-wrap text-sm text-gray-200 bg-dark-900/80 border border-dark-700 rounded-xl p-4 leading-relaxed">${r.body}</pre>
    <div class="flex gap-2 mt-4">
      <button onclick="downloadResource(${i})" class="flex-1 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 font-medium">Download .txt</button>
      <button onclick="toast('Saved to My Drive (demo)')" class="px-4 py-2.5 rounded-xl border border-dark-700">Save</button>
    </div>
  `);
}
function downloadResource(i) {
  const r = resources[i];
  const blob = new Blob([`${r.title}\n${r.branch} | ${r.sub} | ${r.year}\n\n${r.body}`], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = r.title.replace(/\s+/g, '_') + '.txt';
  a.click();
  toast('Download started');
}

function renderEvents() {
  document.getElementById('evApp').innerHTML = backBtn('Campus Events', 'UIET Kurukshetra') +
    events.map((e,i) => `<div class="bg-dark-800/60 border border-dark-700 rounded-2xl p-5 mb-4">
      <div class="flex justify-between"><h3 class="font-bold">${e.title}</h3><span class="text-xs text-purple-300">${e.tag}</span></div>
      <p class="text-sm text-gray-400 mt-1">${e.when}</p>
      <p class="text-sm text-gray-300 mt-2">${e.desc}</p>
      <button onclick="toast('Registered for ${e.title}')" class="mt-4 text-sm px-3 py-2 rounded-lg bg-purple-500/20 text-purple-200">Register</button>
    </div>`).join('');
}

function renderCanteen() {
  const items = menu.map((m,i) => {
    const q = cart[i] || 0;
    return `<div class="flex items-center justify-between bg-dark-800/60 border border-dark-700 rounded-2xl p-4 mb-3">
      <div><p class="font-semibold">${m.name}</p><p class="text-sm text-orange-300">₹${m.price}</p></div>
      <div class="flex items-center gap-3">
        <button onclick="cartAdd(${i},-1)" class="w-8 h-8 rounded-lg bg-dark-700">−</button>
        <span>${q}</span>
        <button onclick="cartAdd(${i},1)" class="w-8 h-8 rounded-lg bg-orange-500/30">+</button>
      </div>
    </div>`;
  }).join('');
  const total = menu.reduce((s,m,i) => s + m.price * (cart[i]||0), 0);
  document.getElementById('canApp').innerHTML = backBtn('Night Canteen', 'Hostel delivery • open till 3 AM') + items +
    `<div class="sticky bottom-4 mt-4 bg-dark-800 border border-dark-700 rounded-2xl p-4 flex justify-between items-center">
      <p class="font-bold">Total ₹${total}</p>
      <button onclick="placeOrder()" class="px-4 py-2 rounded-xl bg-orange-500 text-white font-medium">Order to BH-2</button>
    </div>`;
}
function cartAdd(i, d) {
  cart[i] = Math.max(0, (cart[i] || 0) + d);
  renderCanteen();
}
function placeOrder() {
  const total = menu.reduce((s,m,i) => s + m.price * (cart[i]||0), 0);
  if (!total) { toast('Add something first'); return; }
  cart = {};
  renderCanteen();
  toast('Order placed • ETA 20 min');
}

function renderHostel() {
  document.getElementById('hosApp').innerHTML = backBtn('Hostel Fix', 'Upvote issues for faster admin response') +
    `<form onsubmit="addIssue(event)" class="mb-6 flex gap-2">
      <input id="issueInput" class="flex-1 bg-dark-800 border border-dark-700 rounded-xl px-3 py-2 text-sm outline-none focus:border-rose-400" placeholder="Describe the issue…">
      <button class="px-4 py-2 rounded-xl bg-rose-500/80 font-medium">Raise</button>
    </form>` +
    issues.map((x,i) => `<div class="flex items-center justify-between bg-dark-800/60 border border-dark-700 rounded-2xl p-4 mb-3">
      <div><p class="font-semibold">${x.title}</p><p class="text-xs text-rose-300 mt-1">${x.status}</p></div>
      <button onclick="voteIssue(${i})" class="px-3 py-2 rounded-xl bg-dark-700 text-sm">▲ ${x.votes}</button>
    </div>`).join('');
}
function addIssue(e) {
  e.preventDefault();
  const v = document.getElementById('issueInput').value.trim();
  if (!v) return;
  issues.unshift({ title: v, votes: 1, status: 'Open' });
  renderHostel();
  toast('Ticket raised');
}
function voteIssue(i) { issues[i].votes++; renderHostel(); }

function renderHM() {
  document.getElementById('hmApp').innerHTML = backBtn('HackMatch', 'Find teammates for E-Summit / hackathons') +
    mates.map(m => `<div class="flex items-center justify-between bg-dark-800/60 border border-dark-700 rounded-2xl p-4 mb-3">
      <div class="flex items-center gap-3">
        <img class="w-10 h-10 rounded-full" src="https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=0891b2&color=fff" alt="">
        <div><p class="font-semibold">${m.name}</p><p class="text-xs text-gray-400">${m.branch} • ${m.skill}</p></div>
      </div>
      <button onclick="toast('Ping sent to ${m.name}')" class="text-sm px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-300">Ping</button>
    </div>`).join('');
}

document.getElementById('bellBtn').onclick = () => toast('MPI in E-204 with Dr. Neha Sharma • 15 min');
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
</script>
</body>
</html>
